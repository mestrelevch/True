<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кто упырь? 🤔</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            margin: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border-radius: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            padding: 2.5rem 2rem 2.8rem;
            max-width: 550px;
            width: 100%;
            border: 1px solid rgba(255, 215, 0, 0.3);
            transition: transform 0.2s ease;
            text-align: center;
        }

        .card:hover {
            transform: scale(1.01);
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #f9d423 0%, #ff8c00 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1.2rem;
            text-shadow: 0 2px 20px rgba(255, 215, 0, 0.4);
            word-break: break-word;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .bat-icon {
            font-size: 2.2rem;
            filter: drop-shadow(0 0 10px gold);
            display: inline-block;
            transform: rotate(10deg);
        }

        .button-wrapper {
            margin: 2rem 0 2.5rem;
        }

        .btn {
            background: linear-gradient(145deg, #2b2b3f, #1e1e2f);
            border: none;
            border-radius: 100px;
            padding: 1.2rem 2.8rem;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffdf7e;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 15px 25px -8px rgba(0, 0, 0, 0.8), 0 0 0 2px #ffd96680, 0 0 15px #ffb34740;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-family: inherit;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            line-height: 1.2;
            border: 1px solid #ffd96660;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .btn:hover {
            background: linear-gradient(145deg, #35354d, #252538);
            box-shadow: 0 18px 30px -8px black, 0 0 0 3px #ffd966, 0 0 30px #ffae00;
            color: #fff3c9;
            transform: translateY(-3px);
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 8px 15px -5px black, 0 0 0 2px #ffd966;
        }

        .btn:focus-visible {
            outline: 3px solid #ffb347;
            outline-offset: 4px;
        }

        .result-box {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 3rem;
            padding: 1.8rem 1rem;
            margin-top: 0.5rem;
            border: 1px solid rgba(255, 215, 0, 0.5);
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.7), 0 10px 20px -5px black;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            min-height: 6.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .result-text {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.3;
            word-break: break-word;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            color: #ffe484;
            letter-spacing: 0.02em;
            animation: pulseGlow 1.8s infinite alternate;
            padding: 0 0.5rem;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 8px #ffbb33, 0 0 15px #ff8800; }
            100% { text-shadow: 0 0 18px #ffd966, 0 0 30px #ffaa00; }
        }

        .subnote {
            margin-top: 1.8rem;
            font-size: 0.85rem;
            color: #a7a9be;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        /* адаптив */
        @media (max-width: 480px) {
            .card {
                padding: 1.8rem 1rem 2rem;
                border-radius: 2rem;
            }

            h1 {
                font-size: 1.9rem;
                gap: 0.2rem;
                flex-wrap: wrap;
            }

            .bat-icon {
                font-size: 1.8rem;
            }

            .btn {
                font-size: 1.5rem;
                padding: 1rem 1.5rem;
            }

            .result-text {
                font-size: 1.9rem;
            }

            .result-box {
                min-height: 5.5rem;
                padding: 1rem 0.5rem;
            }
        }

        @media (max-width: 360px) {
            h1 {
                font-size: 1.5rem;
            }

            .btn {
                font-size: 1.3rem;
                padding: 0.9rem 0.8rem;
                gap: 0.2rem;
            }

            .result-text {
                font-size: 1.5rem;
            }
        }

        /* если результат не выведен — полупрозрачная заглушка */
        .result-text.placeholder {
            opacity: 0.5;
            font-weight: 500;
            font-size: 1.4rem;
            color: #c0c0d0;
            animation: none;
            text-shadow: none;
            letter-spacing: 0.1em;
        }

        /* легкая анимация появления */
        .reveal {
            animation: popIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            <span class="bat-icon">🦇</span>
            Кто упырь?
            <span class="bat-icon" style="transform: rotate(-10deg);">🦇</span>
        </h1>

        <div class="button-wrapper">
            <button class="btn" id="whoBtn">
                <span>🧛</span> Кто упырь <span>🧛</span>
            </button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-text placeholder" id="resultText">нажми на кнопку</div>
        </div>

        <div class="subnote">тайна раскроется...</div>
    </div>

    <script>
        (function() {
            const btn = document.getElementById('whoBtn');
            const resultText = document.getElementById('resultText');
            const resultBox = document.getElementById('resultBox');

            // Исходное состояние
            let isRevealed = false;

            // Звуковой эффект? Нет, не нужно. Но можно добавить вибрацию, если хотим.
            // Добавим лёгкую вибрацию для мобильных устройств (опционально)
            function vibrate() {
                if (navigator.vibrate) {
                    navigator.vibrate(30); // короткая вибрация
                }
            }

            // Функция обновления текста с анимацией
            function updateResult(text, isPlaceholder = false) {
                // Убираем анимацию, чтобы перезапустить
                resultText.classList.remove('reveal', 'placeholder');

                // Небольшая задержка, чтобы анимация сработала заново
                void resultText.offsetWidth; // reflow

                resultText.textContent = text;

                if (isPlaceholder) {
                    resultText.classList.add('placeholder');
                } else {
                    resultText.classList.add('reveal');
                    // Добавим лёгкое свечение контейнеру
                    resultBox.style.transition = 'box-shadow 0.3s, border-color 0.3s';
                    resultBox.style.boxShadow = 'inset 0 5px 15px rgba(0,0,0,0.7), 0 0 30px #ffb34780';
                    setTimeout(() => {
                        resultBox.style.boxShadow = 'inset 0 5px 15px rgba(0,0,0,0.7), 0 10px 20px -5px black';
                    }, 400);
                }
            }

            // Обработчик нажатия
            btn.addEventListener('click', function() {
                vibrate();

                // Меняем текст на "Аленка упырь"
                updateResult('Аленка упырь', false);

                // Добавляем забавный эффект: кнопка слегка меняет текст (опционально)
                // Но кнопка остаётся "Кто упырь", не нужно менять.

                // Если нужно, можно менять цвет кнопки кратковременно
                btn.style.transition = 'background 0.15s, box-shadow 0.15s';
                btn.style.background = 'linear-gradient(145deg, #4a2e2e, #2e1e1e)';
                btn.style.boxShadow = '0 0 0 3px #ff6666, 0 0 30px #ff3333';
                setTimeout(() => {
                    btn.style.background = ''; // возвращаем к исходному через CSS
                    btn.style.boxShadow = '';
                }, 200);

                isRevealed = true;
            });

            // Дополнительно: по двойному клику можно сбросить (шутка), но не обязательно.
            // Сделаем, чтобы при повторном нажатии текст оставался тем же, но с анимацией.
            // (повторный вызов функции просто обновит текст с анимацией — это нормально)

            // Для интереса: если пользователь наводит, меняем подпись? Не нужно.

            // Инициализация не требуется, так как placeholder уже установлен в HTML.
            // Но на всякий случай синхронизируем классы.
            // Убедимся, что у resultText нет лишних классов
            resultText.className = 'result-text placeholder';
        })();
    </script>
</body>
</html>
